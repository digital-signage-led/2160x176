<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2160×256 横スライド - 大阪市</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Noto+Sans+JP:wght@700;800&display=swap">
  <style>
    :root {
      --stage-w: 2160px;
      --stage-h: 256px;
      --face-w: 240px;
      --top-h: 56px;
      --body-h: 200px;
      --foot-h: 0px;
      --foot-bg: #fff9f0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      position: relative;
    }
    /* 原点 (0, 0)。左上から配置し、拡大しない */
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 2160px;
      height: 256px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #FFEE00;
      transform-origin: 0 0;
      visibility: hidden;
    }
    .stage.is-ready { visibility: visible; }
    .track {
      display: flex;
      flex-direction: row;
      height: 256px;
      width: max-content;
      transform-origin: 0 0;
      will-change: transform;
    }
    .col {
      position: relative;
      width: var(--face-w);
      flex: 0 0 var(--face-w);
      height: 256px;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }
    .top {
      height: var(--top-h);
      flex: 0 0 var(--top-h);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF44D;
      padding: 0 2px;
      overflow: visible;
    }
    .label {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 1;
      letter-spacing: 0;
      color: #000;
      white-space: nowrap;
      text-align: center;
      min-width: 0;
      max-width: none;
    }
    .body {
      height: var(--body-h);
      flex: 0 0 var(--body-h);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFEE00;
      padding: 0 2px;
      overflow: visible;
    }
    .val {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 1px;
      max-width: 100%;
      min-width: 0;
      white-space: nowrap;
    }
    .num, .unit { min-width: 0; }
    .num {
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: 120px;
      line-height: 1;
      color: #000;
    }
    .unit {
      font-family: "Inter", sans-serif;
      font-weight: 600;
      font-size: 52px;
      line-height: 1;
      color: #000;
    }
    .dir {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 800;
      font-size: 100px;
      line-height: 1;
      color: #000;
      min-width: 0;
      max-width: none;
      white-space: nowrap;
      text-align: center;
    }
    .icon {
      width: 200px;
      height: 120px;
      background: #fff;
      border-radius: 8px;
      object-fit: contain;
      display: block;
    }
    .range {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 1px;
      padding: 2px 4px 3px;
      background: #fff;
      border-radius: 8px;
      max-width: 228px;
      white-space: nowrap;
      line-height: 1;
    }
    .hi, .lo, .sep {
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: 96px;
      line-height: 1;
    }
    .hi { color: #e02020; }
    .lo { color: #2060e0; }
    .sep { color: #1a1a1a; }
    .range .unit {
      font-size: 44px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .foot {
      display: none;
      height: var(--foot-h);
      flex: 0 0 var(--foot-h);
      align-items: center;
      justify-content: center;
      background: var(--foot-bg);
      padding: 0 3px;
      overflow: visible;
    }
    .foot.is-span {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 2;
      height: var(--foot-h);
    }
    .foot.is-covered {
      visibility: hidden;
    }
    .foot-txt {
      display: block;
      width: 100%;
      max-width: none;
      white-space: nowrap;
      text-align: center;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 56px;
      color: #1a1a1a;
      letter-spacing: 0;
    }
    .foot-txt.is-line {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      max-width: none;
    }
    .foot-piece {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 56px;
      color: #1a1a1a;
      white-space: nowrap;
    }
    .board-foot {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      height: var(--foot-h);
      align-items: center;
      justify-content: center;
      background: var(--foot-bg);
      overflow: hidden;
    }
    .stage.is-light .label,
    .stage.is-light .num,
    .stage.is-light .dir,
    .stage.is-light .unit { color: #ebebeb; }

    /* 1080×1920。9面を3列にし、下帯の文言は横長と同じ */
    .stage.is-portrait {
      width: 1080px;
      height: 1920px;
    }
    .stage.is-portrait .track {
      display: grid;
      grid-template-columns: repeat(3, 360px);
      grid-template-rows: repeat(3, 584px);
      width: 1080px;
      height: 1752px;
      transform: none !important;
    }
    .stage.is-portrait .col {
      width: 360px;
      height: 584px;
      flex: none;
      overflow: hidden;
    }
    .stage.is-portrait .top {
      height: 128px;
      flex-basis: 128px;
    }
    .stage.is-portrait .label {
      font-size: 72px;
    }
    .stage.is-portrait .body {
      height: 456px;
      flex-basis: 456px;
    }
    .stage.is-portrait .foot {
      display: none;
    }
    .stage.is-portrait .val {
      max-width: 340px;
      gap: 8px;
    }
    .stage.is-portrait .num { font-size: 200px; }
    .stage.is-portrait .unit { font-size: 72px; }
    .stage.is-portrait .dir {
      font-size: 148px;
    }
    .stage.is-portrait .icon {
      width: 260px;
      height: 176px;
      border-radius: 18px;
    }
    .stage.is-portrait .range {
      max-width: 340px;
      gap: 6px;
      padding: 10px 16px 12px;
      border-radius: 16px;
    }
    .stage.is-portrait .hi,
    .stage.is-portrait .lo,
    .stage.is-portrait .sep { font-size: 132px; }
    .stage.is-portrait .range .unit { font-size: 56px; }
    .stage.is-portrait .board-foot {
      display: none;
      width: 1080px;
      right: auto;
      height: 168px;
    }
    .stage.is-portrait .board-foot .foot-txt {
      max-width: none;
      line-height: 1.2;
    }
    .stage.is-portrait .board-foot .foot-piece {
      font-size: 44px;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="横スライド 気象 大阪市">
    <div class="track" id="track"></div>
    <div class="board-foot" id="board-foot"></div>
  </main>
  <script src="./assets/jma-weather-icons.js"></script>
  <script>
    /* 大阪市。アメダス「大阪」(62078)。面幅は 240px */
    var SITE = {
      label: '大阪市',
      amedas: '62078',
      forecastArea: '270000'
    };
    var FACE = 240;
    var STAGE = 2160;
    var SCROLL_SPEED = 50;
    /* 1周して左へ流れ続ける */
    var ORDER = ['weather', 'temp', 'rain', 'wdir', 'wind', 'humi', 'pres', 'tmaxmin', 'gust'];
    var LABELS = {
      weather: '天気', temp: '気温', rain: '降水量', wdir: '風向き', wind: '風速',
      humi: '湿度', pres: '気圧', tmaxmin: '最高/最低', gust: '最大瞬間風速'
    };
    var DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];

    var layoutMode = '';
    var layoutWidth = 0;
    var lastShow = null;

    function isPortraitView() {
      return window.innerHeight > window.innerWidth;
    }

    function fitStage() {
      /* CSSの解像度は 2160×256。窓が違うときだけ、全体が入るように縮小する */
      var stage = document.getElementById('stage');
      stage.classList.remove('is-portrait');
      stage.style.width = '2160px';
      stage.style.height = '256px';
      stage.style.transformOrigin = '0 0';
      var s = Math.min(window.innerWidth / 2160, window.innerHeight / 256);
      if (!isFinite(s) || s <= 0) s = 1;
      if (s > 1) s = 1;
      stage.style.left = Math.max(0, Math.round((window.innerWidth - 2160 * s) / 2)) + 'px';
      stage.style.top = Math.max(0, Math.round((window.innerHeight - 256 * s) / 2)) + 'px';
      stage.style.transform = (Math.abs(s - 1) < 0.001) ? 'none' : ('scale(' + s + ')');
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    function fieldValue(field) {
      if (!Array.isArray(field) || field.length < 1) return null;
      var v = field[0];
      var q = field[1];
      if (v === '' || v == null) return null;
      if (q === 5 || q === 6) return null;
      return v;
    }

    function colorsForTemp(t) {
      if (t == null || !isFinite(Number(t))) return { bg: '#484848', bar: '#585858', light: true };
      t = Number(t);
      if (t >= 31) return { bg: '#ED1A3D', bar: '#F24A64', light: true };
      if (t >= 28) return { bg: '#F39800', bar: '#FFB133', light: true };
      if (t >= 25) return { bg: '#FFEE00', bar: '#FFF44D', light: false };
      if (t >= 21) return { bg: '#67C1EA', bar: '#85D0F0', light: false };
      return { bg: '#3181BD', bar: '#4A96CC', light: true };
    }

    function panelHtml(type) {
      var body = '';
      if (type === 'weather') {
        body = '<img class="icon weather-icon" alt="" src="./assets/jma-weather/100.svg">';
      } else if (type === 'wdir') {
        body = '<span class="dir dir-val"></span>';
      } else if (type === 'tmaxmin') {
        body = '<div class="range"><span class="hi tmax-val">--</span><span class="sep">/</span><span class="lo tmin-val">--</span><span class="unit">℃</span></div>';
      } else {
        var unit = { temp: '℃', rain: 'mm', wind: 'm/s', humi: '%', pres: 'hPa', gust: 'm/s' }[type];
        body = '<div class="val"><span class="num ' + type + '-val"></span><span class="unit">' + unit + '</span></div>';
      }
      return '<section class="col" data-type="' + type + '">' +
        '<div class="top"><span class="label">' + LABELS[type] + '</span></div>' +
        '<div class="body">' + body + '</div>' +
        '<div class="foot"><span class="foot-txt" data-foot="' + type + '"></span></div>' +
        '</section>';
    }

    function setWidth() {
      var w = 0;
      for (var i = 0; i < ORDER.length; i++) w += FACE;
      return w;
    }

    function buildTrack() {
      var lap = setWidth();
      var stage = document.getElementById('stage');
      var portrait = stage.classList.contains('is-portrait');
      var viewW = portrait ? 1080 : (parseFloat(stage.style.width) || STAGE);
      var copies = portrait ? 1 : 2;
      var html = '';
      for (var c = 0; c < copies; c++) {
        for (var i = 0; i < ORDER.length; i++) html += panelHtml(ORDER[i]);
      }
      var track = document.getElementById('track');
      track.innerHTML = html;
      track.dataset.lap = String(measureLap() || lap);
      startScroll();
    }

    function measureLap() {
      var cols = document.querySelectorAll('#track > .col');
      var n = ORDER.length;
      if (cols.length < n) return setWidth();
      var lap = 0;
      for (var i = 0; i < n; i++) lap += cols[i].offsetWidth;
      return lap > 0 ? lap : setWidth();
    }

    function startScroll() {
      var track = document.getElementById('track');
      var stage = document.getElementById('stage');
      var lap = Number(track.dataset.lap) || setWidth();
      if (stage.classList.contains('is-portrait') || lap <= 0) {
        track.style.animation = 'none';
        delete track.dataset.scrolling;
        return;
      }
      /* すでに同じ周長で流しているときは、更新で止めたり先頭へ戻したりしない */
      if (track.dataset.scrolling === String(lap)) return;
      var sheet = document.getElementById('ticker-style');
      if (!sheet) {
        sheet = document.createElement('style');
        sheet.id = 'ticker-style';
        document.head.appendChild(sheet);
      }
      sheet.textContent = '@keyframes ticker{from{transform:translate3d(0,0,0)}to{transform:translate3d(-' + lap + 'px,0,0)}}';
      track.dataset.scrolling = String(lap);
      track.style.animation = 'ticker ' + (lap / SCROLL_SPEED) + 's linear infinite';
    }

    function shrink(el, start, min, limit) {
      if (!el) return;
      el.style.maxWidth = 'none';
      var size = start;
      el.style.fontSize = size + 'px';
      var parent = el.parentElement;
      var cap = limit || (parent && parent.clientWidth) || el.clientWidth || 122;
      while (size > min && el.scrollWidth > cap + 1) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
    }

    function fitText() {
      var portrait = document.getElementById('stage').classList.contains('is-portrait');
      var labelStart = portrait ? 72 : 48;
      var labelMin = portrait ? 28 : 20;
      var labelCap = portrait ? 340 : 224;
      var dirStart = portrait ? 148 : 100;
      var dirMin = portrait ? 64 : 40;
      var dirCap = portrait ? 340 : 224;
      var numStart = portrait ? 200 : 120;
      var numMin = portrait ? 72 : 48;
      var numCap = portrait ? 340 : 224;
      var rangeStart = portrait ? 132 : 96;
      var rangeMin = portrait ? 56 : 40;
      var rangeCap = portrait ? 340 : 224;
      document.querySelectorAll('.label').forEach(function (el) { shrink(el, labelStart, labelMin, labelCap); });
      document.querySelectorAll('.dir-val').forEach(function (el) { shrink(el, dirStart, dirMin, dirCap); });
      groupFeet();
      document.querySelectorAll('.val').forEach(function (wrap) {
        var num = wrap.querySelector('.num');
        var unit = wrap.querySelector('.unit');
        if (!num) return;
        var size = numStart;
        function apply(n) {
          num.style.fontSize = n + 'px';
          if (unit) unit.style.fontSize = Math.max(portrait ? 36 : 36, Math.round(n * 0.42)) + 'px';
        }
        apply(size);
        while (size > numMin && wrap.scrollWidth > numCap) {
          size -= 1;
          apply(size);
        }
      });
      document.querySelectorAll('.range').forEach(function (card) {
        var hi = card.querySelector('.tmax-val');
        var lo = card.querySelector('.tmin-val');
        var sep = card.querySelector('.sep');
        var size = rangeStart;
        [hi, lo, sep].forEach(function (el) { if (el) el.style.fontSize = size + 'px'; });
        while (size > rangeMin && card.scrollWidth > rangeCap) {
          size -= 1;
          [hi, lo, sep].forEach(function (el) { if (el) el.style.fontSize = size + 'px'; });
        }
        var unit = card.querySelector('.unit');
        if (unit) unit.style.fontSize = Math.max(portrait ? 32 : 32, Math.round(size * 0.46)) + 'px';
      });
      startScroll();
    }

    var FOOT_PARTS = [SITE.label];

    function setFootParts(when) {
      if (!when || !when.stamp) {
        FOOT_PARTS = [SITE.label];
        return;
      }
      FOOT_PARTS = [SITE.label, when.stamp, '降水量は10分間', '最高/最低は日中'];
    }

    function fillBoardFoot() {
      var bar = document.getElementById('board-foot');
      bar.innerHTML = '';
      var txt = document.createElement('div');
      txt.className = 'foot-txt is-line';
      FOOT_PARTS.forEach(function (part) {
        var piece = document.createElement('span');
        piece.className = 'foot-piece';
        piece.textContent = part;
        txt.appendChild(piece);
      });
      bar.appendChild(txt);
      var cap = bar.clientWidth > 40 ? bar.clientWidth - 12 : 1040;
      var size = cap > 800 ? 48 : 32;
      var pieces = txt.querySelectorAll('.foot-piece');
      pieces.forEach(function (el) { el.style.fontSize = size + 'px'; });
      while (size > 10 && txt.scrollWidth > cap) {
        size -= 1;
        pieces.forEach(function (el) { el.style.fontSize = size + 'px'; });
      }
    }

    function groupFeet() {
      var cols = Array.prototype.slice.call(document.querySelectorAll('#track > .col'));
      cols.forEach(function (col) {
        var foot = col.querySelector('.foot');
        if (!foot) return;
        foot.classList.remove('is-span', 'is-covered');
        foot.style.width = '';
        var txt = foot.querySelector('.foot-txt');
        if (!txt) return;
        txt.classList.remove('is-line');
        txt.style.maxWidth = '';
        txt.textContent = '';
      });
      var step = ORDER.length;
      for (var i = 0; i < cols.length; i += step) {
        var count = Math.min(step, cols.length - i);
        var j = i + count;
        var foot = cols[i].querySelector('.foot');
        var txt = foot.querySelector('.foot-txt');
        var width = 0;
        for (var n = i; n < j; n++) width += cols[n].offsetWidth;
        foot.classList.add('is-span');
        foot.style.width = width + 'px';
        txt.classList.add('is-line');
        txt.style.maxWidth = 'none';
        FOOT_PARTS.forEach(function (part) {
          var piece = document.createElement('span');
          piece.className = 'foot-piece';
          piece.textContent = part;
          txt.appendChild(piece);
        });
        var size = 48;
        var pieces = txt.querySelectorAll('.foot-piece');
        pieces.forEach(function (el) { el.style.fontSize = size + 'px'; });
        while (size > 28 && txt.scrollWidth > width - 16) {
          size -= 1;
          pieces.forEach(function (el) { el.style.fontSize = size + 'px'; });
        }
        for (var k = i + 1; k < j; k++) {
          var covered = cols[k].querySelector('.foot');
          if (covered) covered.classList.add('is-covered');
        }
      }
    }

    function paint(temp) {
      var c = colorsForTemp(temp);
      var stage = document.getElementById('stage');
      stage.classList.toggle('is-light', c.light);
      stage.style.background = c.bg;
      document.querySelectorAll('.col .top').forEach(function (el) { el.style.background = c.bar; });
      document.querySelectorAll('.col .body').forEach(function (el) { el.style.background = c.bg; });
    }

    function setAll(selector, value) {
      var text = value == null ? '' : String(value);
      var nodes = document.querySelectorAll(selector);
      if (!text || text === '--') {
        var has = false;
        nodes.forEach(function (el) {
          if (el.textContent && el.textContent !== '--') has = true;
        });
        if (has) return;
        if (!text) text = '--';
      }
      nodes.forEach(function (el) {
        if (el.textContent !== text) el.textContent = text;
      });
    }

    var CACHE_KEY = 'slide-osaka-' + SITE.amedas;
    var shownIso = '';
    var refreshing = false;

    function readCache() {
      try {
        var data = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (!data || !data.obs || !data.iso) return null;
        return data;
      } catch (e) { return null; }
    }

    function writeCache(obs, iso, code) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ obs: obs, iso: iso, code: code || null }));
      } catch (e) {}
    }

    function preload(src) {
      return new Promise(function (resolve) {
        if (!src) { resolve(); return; }
        var img = new Image();
        var done = function () { resolve(); };
        img.onload = done;
        img.onerror = done;
        img.src = src;
        if (img.complete) resolve();
      });
    }

    function iconForCode(code) {
      if (window.JmaWeatherIcons) return JmaWeatherIcons.url(code);
      return './assets/jma-weather/100.svg';
    }

    function iconFromObs(obs) {
      var p10 = fieldValue(obs.precipitation10m);
      var p1 = fieldValue(obs.precipitation1h);
      if ((p10 != null && Number(p10) > 0) || (p1 != null && Number(p1) > 0)) return iconForCode(300);
      var sun = fieldValue(obs.sun1h);
      if (sun != null && Number(sun) < 0.2) return iconForCode(200);
      return iconForCode(100);
    }

    function jstParts(date) {
      var fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23', hour12: false
      });
      var p = {};
      fmt.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      var hour = Number(p.hour);
      return {
        month: Number(p.month),
        day: Number(p.day),
        hour: String(Number.isFinite(hour) ? hour % 24 : 0).padStart(2, '0'),
        minute: p.minute
      };
    }

    function clockFrom(date) {
      var p = jstParts(date);
      var dateText = p.month + '/' + p.day;
      var timeText = p.hour + ':' + p.minute;
      return {
        date: dateText,
        time: timeText,
        stamp: dateText + ' ' + timeText
      };
    }

    function pickObs(data, exactKey) {
      if (data && data.temp) return data;
      var keys = Object.keys(data || {}).filter(function (k) { return /^\d{14}$/.test(k); }).sort();
      if (!keys.length) throw new Error('観測JSONの形式が不明');
      if (data[exactKey]) return data[exactKey];
      var older = keys.filter(function (k) { return k <= exactKey; });
      return data[older.length ? older[older.length - 1] : keys[keys.length - 1]];
    }

    function fetchTimed(url) {
      var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      return fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined }).then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res;
      }, function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
    }

    async function fetchJson(url) {
      var res = await fetchTimed(url);
      return res.json();
    }

    async function loadLatestIso() {
      var timeRes = await fetchTimed('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt');
      var iso = (await timeRes.text()).trim();
      if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(iso)) iso = iso.replace(/\.\d+$/, '') + '+09:00';
      return iso;
    }

    function fillFromHistory(data, obs, exactKey) {
      if (!data || !obs || data.temp) return obs;
      var keys = Object.keys(data).filter(function (k) { return /^\d{14}$/.test(k); }).sort();
      var older = keys.filter(function (k) { return k <= exactKey; }).reverse();
      var out = {};
      Object.keys(obs).forEach(function (k) { out[k] = obs[k]; });
      ['temp', 'humidity', 'precipitation10m', 'precipitation1h', 'wind', 'windDirection', 'normalPressure', 'pressure', 'maxTemp', 'minTemp', 'gust', 'sun1h'].forEach(function (field) {
        if (fieldValue(out[field]) != null) return;
        for (var i = 0; i < older.length; i++) {
          var cand = data[older[i]];
          if (cand && fieldValue(cand[field]) != null) {
            out[field] = cand[field];
            break;
          }
        }
      });
      return out;
    }

    async function loadAmedas(iso) {
      var latest = new Date(iso);
      var p = jstParts(latest);
      var parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hourCycle: 'h23'
      }).formatToParts(latest);
      var bag = {};
      parts.forEach(function (x) { bag[x.type] = x.value; });
      var ymd = bag.year + bag.month + bag.day;
      var hhmm = p.hour + p.minute;
      var exactKey = ymd + hhmm + '00';
      var blockH = String(Math.floor(Number(p.hour) / 3) * 3).padStart(2, '0');
      var pointUrl = 'https://www.jma.go.jp/bosai/amedas/data/point/' + SITE.amedas + '/' + ymd + '_' + blockH + '.json';
      var mapUrl = 'https://www.jma.go.jp/bosai/amedas/data/map/' + ymd + hhmm + '00.json';
      try {
        var data = await fetchJson(pointUrl);
        var slot = data[exactKey];
        var fresh = !!(slot && fieldValue(slot.temp) != null);
        var obs = fillFromHistory(data, pickObs(data, exactKey), exactKey);
        return { obs: obs, latest: latest, fresh: fresh };
      } catch (e) {}
      var map = await fetchJson(mapUrl);
      if (!map[SITE.amedas]) throw new Error('地点なし');
      return { obs: map[SITE.amedas], latest: latest, fresh: fieldValue(map[SITE.amedas].temp) != null };
    }

    async function loadForecastCode() {
      var data = await fetchJson('https://www.jma.go.jp/bosai/forecast/data/forecast/' + SITE.forecastArea + '.json');
      if (!Array.isArray(data)) return null;
      for (var i = 0; i < data.length; i++) {
        var series = data[i] && data[i].timeSeries;
        if (!Array.isArray(series)) continue;
        for (var j = 0; j < series.length; j++) {
          var area = series[j].areas && series[j].areas[0];
          if (area && area.weatherCodes && area.weatherCodes.length && area.weatherCodes[0] !== '') {
            return area.weatherCodes[0];
          }
        }
      }
      return null;
    }

    function show(obs, latest, forecastCode, iso) {
      lastShow = { obs: obs, latest: latest, code: forecastCode };
      if (iso) {
        shownIso = iso;
        writeCache(obs, iso, forecastCode);
      }
      var temp = fieldValue(obs.temp);
      var humi = fieldValue(obs.humidity);
      var p10 = fieldValue(obs.precipitation10m);
      var wind = fieldValue(obs.wind);
      var pres = fieldValue(obs.normalPressure);
      if (pres == null) pres = fieldValue(obs.pressure);
      var wdir = fieldValue(obs.windDirection);
      var maxT = fieldValue(obs.maxTemp);
      var minT = fieldValue(obs.minTemp);
      var gust = fieldValue(obs.gust);
      var when = clockFrom(latest);

      setAll('.temp-val', temp != null ? String(Math.round(Number(temp))) : '--');
      setAll('.humi-val', humi != null ? String(Math.round(Number(humi))) : '--');
      setAll('.rain-val', p10 != null ? Number(p10).toFixed(1) : '--');
      setAll('.pres-val', pres != null ? String(Math.round(Number(pres))) : '--');
      setAll('.wind-val', wind != null ? Number(wind).toFixed(1) : '--');
      setAll('.gust-val', gust != null ? Number(gust).toFixed(1) : '--');
      setAll('.dir-val', wdir != null ? (DIRS[Math.round(Number(wdir)) % 16] || '--') : '--');
      setAll('.tmax-val', maxT != null ? String(Math.round(Number(maxT))) : '--');
      setAll('.tmin-val', minT != null ? String(Math.round(Number(minT))) : '--');

      var src = forecastCode != null ? iconForCode(forecastCode) : iconFromObs(obs);
      document.querySelectorAll('.weather-icon').forEach(function (el) {
        if (el.getAttribute('src') !== src) el.setAttribute('src', src);
      });
      setFootParts(when);
      paint(temp);
      var track = document.getElementById('track');
      if (track.dataset.fitted === '1') updateFeetText();
      else {
        fitText();
        track.dataset.fitted = '1';
      }
      document.getElementById('stage').classList.add('is-ready');
    }

    function updateFeetText() {
      document.querySelectorAll('.foot-txt.is-line').forEach(function (txt) {
        var pieces = txt.querySelectorAll('.foot-piece');
        if (pieces.length !== FOOT_PARTS.length) return;
        for (var i = 0; i < pieces.length; i++) {
          if (pieces[i].textContent !== FOOT_PARTS[i]) pieces[i].textContent = FOOT_PARTS[i];
        }
      });
    }

    buildTrack();
    var cached = readCache();
    if (cached) show(cached.obs, new Date(cached.iso), cached.code, cached.iso);
    startScroll();

    function observationReady(obs) {
      return !!(obs && fieldValue(obs.temp) != null);
    }

    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      try {
        var iso = await loadLatestIso();
        if (iso === shownIso && lastShow) return;
        var loaded = await loadAmedas(iso);
        if (!observationReady(loaded.obs)) return;
        /* 新しい時刻の気温が届くまで、いま出ている数値は変えない */
        if (!loaded.fresh && lastShow) return;
        var code = lastShow ? lastShow.code : null;
        try {
          var nextCode = await loadForecastCode();
          if (nextCode) code = nextCode;
        } catch (e) {}
        var src = code != null ? iconForCode(code) : iconFromObs(loaded.obs);
        await preload(src);
        if (loaded.fresh && iso === shownIso && lastShow) return;
        show(loaded.obs, loaded.latest, code, loaded.fresh ? iso : null);
      } catch (e) {}
      finally { refreshing = false; }
    }

    refresh();
    /* 時刻だけを先に見る。観測が揃ってから、表示中の数字を一度に差し替える */
    setInterval(refresh, 10 * 1000);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        if (document.getElementById('track').dataset.fitted === '1') fitText();
      });
    }
  </script>
</body>
</html>
