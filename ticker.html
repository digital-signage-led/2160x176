<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2160×256 防災情報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 2160px;
      height: 256px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      transform-origin: 0 0;
      contain: strict;
    }
    .marquee {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      width: 2160px;
      height: 248px;
      overflow: hidden;
    }
    .track {
      display: flex;
      height: 248px;
      width: max-content;
      padding-left: 700px;
      backface-visibility: hidden;
    }
    .seq {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      height: 248px;
      width: max-content;
      flex: 0 0 auto;
    }
    .badge {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      width: 700px;
      height: 248px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: #e10600;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      padding: 0 100px 0 16px;
      color: #fff;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      font-weight: 900;
    }
    .badge.is-none { background: #1e3a8a; }
    .badge svg { width: 120px; height: 120px; flex: 0 0 auto; }
    .badge span {
      font-size: 156px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      height: 8px;
      background: #1d4ed8;
    }
    .item {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      height: 248px;
      padding: 0 72px;
      gap: 28px;
      color: #fff;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      font-weight: 700;
    }
    .msg {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0;
      font-size: 80px;
      font-weight: 900;
      white-space: nowrap;
      line-height: 1;
    }
    .msg .name { color: #ffe14a; }
    .msg.is-none { font-size: 84px; }
    .rule {
      flex: 0 0 6px;
      width: 6px;
      height: 150px;
      background: #fff;
    }
    .note {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0;
      font-size: 64px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1;
    }
    .note svg { width: 100px; height: 100px; flex: 0 0 auto; }
    .wx {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      height: 248px;
      margin: 0;
      padding: 0 72px;
      white-space: nowrap;
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      font-weight: 700;
      font-size: 96px;
      line-height: 1;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="防災情報">
    <div class="marquee" id="marquee">
      <div class="track" id="track">
        <div class="seq">
          <div class="item"><p class="msg is-none">警報・注意報は発表されていません</p></div>
        </div>
      </div>
    </div>
    <div class="badge is-none" id="badge">
      <span id="badge-time">00:00</span>
    </div>
    <div class="bar"></div>
  </main>
  <script>
    var AREA = '270000';
    var CITY = '2710000';
    var CITY_NAME = '大阪市';
    var SPEED = 80;
    var signature = '';
    var WARN_NAME = {
      '02': '暴風雪警報', '03': '大雨警報', '04': '洪水警報', '05': '暴風警報',
      '06': '大雪警報', '07': '波浪警報', '08': '高潮警報',
      '10': '大雨注意報', '12': '大雪注意報', '13': '風雪注意報', '14': '雷注意報',
      '15': '強風注意報', '16': '波浪注意報', '17': '融雪注意報', '18': '高潮注意報',
      '19': '濃霧注意報', '20': '乾燥注意報', '21': 'なだれ注意報', '22': '低温注意報',
      '23': '霜注意報', '24': '着氷注意報', '25': '着雪注意報',
      '32': '暴風雪特別警報', '33': '大雨特別警報', '35': '暴風特別警報',
      '36': '大雪特別警報', '37': '波浪特別警報', '38': '高潮特別警報'
    };

    function fitStage() {
      /* 天気ボードと同じ。CSSは 2160×256。窓が違うときだけ全体が入るように縮小する */
      var stage = document.getElementById('stage');
      stage.style.width = '2160px';
      stage.style.height = '256px';
      stage.style.transformOrigin = '0 0';
      var s = Math.min(window.innerWidth / 2160, window.innerHeight / 256);
      if (!isFinite(s) || s <= 0) s = 1;
      if (s > 1) s = 1;
      stage.style.left = Math.max(0, Math.round((window.innerWidth - 2160 * s) / 2)) + 'px';
      stage.style.top = Math.max(0, Math.round((window.innerHeight - 256 * s) / 2)) + 'px';
      stage.style.transform = (Math.abs(s - 1) < 0.001) ? 'none' : ('scale(' + s + ')');
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    function infoIcon() {
      return '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="4"/><rect x="29" y="18" width="6" height="6" fill="#fff"/><rect x="29" y="28" width="6" height="18" fill="#fff"/></svg>';
    }

    function adviceFor(name) {
      if (name.indexOf('強風') >= 0 || name.indexOf('暴風') >= 0) return '屋外作業は十分にご注意ください。';
      if (name.indexOf('大雨') >= 0 || name.indexOf('洪水') >= 0) return '川や低い土地には近づかないでください。';
      if (name.indexOf('雷') >= 0) return '建物の中で安全を確保してください。';
      if (name.indexOf('雪') >= 0) return '外出は十分にご注意ください。';
      if (name.indexOf('波浪') >= 0 || name.indexOf('高潮') >= 0) return '海岸には近づかないでください。';
      if (name.indexOf('濃霧') >= 0) return '見通しが悪くなります。ご注意ください。';
      if (name.indexOf('乾燥') >= 0) return '火の取り扱いにご注意ください。';
      return '最新の情報にご注意ください。';
    }

    function verbFor(status) {
      if (status === '継続') return 'が継続しています';
      return 'が発表されています';
    }

    function messageRow(item) {
      var row = document.createElement('div');
      row.className = 'item';
      var msg = document.createElement('p');
      if (!item) {
        msg.className = 'msg is-none';
        msg.textContent = '警報・注意報は発表されていません';
        row.appendChild(msg);
        return row;
      }
      msg.className = 'msg';
      msg.appendChild(document.createTextNode(CITY_NAME + 'に'));
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      msg.appendChild(name);
      msg.appendChild(document.createTextNode(item.verb));
      row.appendChild(msg);
      var rule = document.createElement('div');
      rule.className = 'rule';
      row.appendChild(rule);
      var note = document.createElement('p');
      note.className = 'note';
      note.insertAdjacentHTML('beforeend', infoIcon());
      var advice = document.createElement('span');
      advice.textContent = item.advice;
      note.appendChild(advice);
      row.appendChild(note);
      return row;
    }

    async function fetchJson(url) {
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function loadItems() {
      var data = await fetchJson('https://www.jma.go.jp/bosai/warning/data/warning/' + AREA + '.json');
      var found = [];
      var seen = {};
      var types = (data && data.areaTypes) || [];
      for (var i = 0; i < types.length; i++) {
        var areas = types[i].areas || [];
        for (var j = 0; j < areas.length; j++) {
          if (String(areas[j].code) !== CITY) continue;
          var list = areas[j].warnings || [];
          for (var k = 0; k < list.length; k++) {
            var status = list[k].status || '';
            if (!status || status === '解除' || status.indexOf('なし') >= 0) continue;
            var key = String(list[k].code);
            if (key.length === 1) key = '0' + key;
            var name = WARN_NAME[key];
            if (!name || seen[name]) continue;
            seen[name] = true;
            found.push({ name: name, verb: verbFor(status), advice: adviceFor(name) });
          }
        }
      }
      return found;
    }

    function linesOf(text) {
      return String(text || '').split(/\n+/).map(function (line) {
        return line.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
      }).filter(function (line) { return line.length > 0; });
    }

    async function loadWeatherLines() {
      var overview = await fetchJson('https://www.jma.go.jp/bosai/forecast/data/overview_forecast/' + AREA + '.json');
      var lines = [];
      linesOf(overview && overview.headlineText).forEach(function (line) { lines.push(line); });
      linesOf(overview && overview.text).forEach(function (line) { lines.push(line); });
      return lines;
    }

    function play(items, lines) {
      var badge = document.getElementById('badge');
      badge.classList.toggle('is-none', items.length === 0);

      var track = document.getElementById('track');
      track.innerHTML = '';
      var seq = document.createElement('div');
      seq.className = 'seq';
      if (!items.length) seq.appendChild(messageRow(null));
      else items.forEach(function (item) { seq.appendChild(messageRow(item)); });
      lines.forEach(function (line) {
        var row = document.createElement('p');
        row.className = 'wx';
        row.textContent = line;
        seq.appendChild(row);
      });
      track.appendChild(seq);
      track.style.animation = 'none';
      track.style.transform = 'none';
      void track.offsetWidth;
      var view = 1460;
      var lap = seq.offsetWidth;
      if (view > lap) {
        seq.style.paddingRight = (view - lap) + 'px';
        lap = view;
      }
      if (!(lap > 0)) return;
      var clone = seq.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      track.appendChild(clone);
      var sheet = document.getElementById('ticker-style');
      if (!sheet) {
        sheet = document.createElement('style');
        sheet.id = 'ticker-style';
        document.head.appendChild(sheet);
      }
      sheet.textContent = '@keyframes ticker{from{transform:translate3d(0,0,0)}to{transform:translate3d(-' + lap + 'px,0,0)}}';
      track.style.animation = 'ticker ' + (lap / SPEED) + 's linear infinite';
    }

    var CACHE_KEY = 'ticker-bosai-v1';

    function pack(items, lines) {
      return items.map(function (item) { return item.name + item.verb; }).join('\n') + '\n' + lines.join('\n');
    }

    function readCache() {
      try {
        var data = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (!data || !Array.isArray(data.items) || !Array.isArray(data.lines)) return null;
        return data;
      } catch (e) { return null; }
    }

    function writeCache(items, lines) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items: items, lines: lines })); } catch (e) {}
    }

    async function refresh() {
      var loaded = await Promise.all([
        loadItems().catch(function () { return []; }),
        loadWeatherLines().catch(function () { return []; })
      ]);
      var items = loaded[0];
      var lines = loaded[1];
      var next = pack(items, lines);
      if (next === signature && trackHasRows()) return;
      signature = next;
      writeCache(items, lines);
      play(items, lines);
    }

    function trackHasRows() {
      return document.querySelector('#track .item, #track .wx');
    }

    function clockText(date) {
      var fmt = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Tokyo',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23', hour12: false
      });
      var p = {};
      fmt.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      var hour = Number(p.hour);
      var hh = String(Number.isFinite(hour) ? hour % 24 : 0).padStart(2, '0');
      return hh + ':' + p.minute;
    }

    function tickClock() {
      var el = document.getElementById('badge-time');
      var next = clockText(new Date());
      if (el.textContent !== next) el.textContent = next;
    }

    tickClock();
    setInterval(tickClock, 1000);
    var cached = readCache();
    if (cached) {
      signature = pack(cached.items, cached.lines);
      play(cached.items, cached.lines);
    }
    refresh();
    setInterval(refresh, 10 * 60 * 1000);
  </script>
</body>
</html>
